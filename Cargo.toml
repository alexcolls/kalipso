[package]
name = "kalipso-cli"
version = "0.3.0"
edition = "2024"

[workspace]
members = ["desktop"]

[dependencies]
crossterm = { version = "0.29", features = ["osc52"] }
ignore = "0.4"
libc = "0.2"
portable-pty = "0.9"
ratatui = "0.30"
regex = "1"
serde_json = "1"
syntect = { version = "5.3", default-features = false, features = ["default-fancy"] }
tui-term = "0.3"
unicode-segmentation = "1"
unicode-width = "0.2"
ureq = "3"
vt100 = "=0.16.2"
