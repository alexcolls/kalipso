name: Release

# Pushing a tag like v0.1.0 publishes Linux x86_64 and Apple silicon builds. If the macOS job
# fails, the Linux release stands and install-cli.sh builds from source on Macs.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: rustup toolchain install stable --profile minimal
      - run: cargo test --locked
      - run: cargo build --release --locked
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          name="kalipso-cli-$TAG-x86_64-linux"
          mkdir "$name"
          cp target/release/kalipso-cli README.md LICENSE "$name"
          tar czf "$name.tar.gz" "$name"
          sha256sum "$name.tar.gz" > "$name.tar.gz.sha256"
          gh release create "$TAG" "$name.tar.gz" "$name.tar.gz.sha256" --generate-notes --verify-tag

  macos:
    needs: release
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - run: rustup toolchain install stable --profile minimal
      - run: cargo test --locked
      - run: cargo build --release --locked
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          name="kalipso-cli-$TAG-aarch64-macos"
          mkdir "$name"
          cp target/release/kalipso-cli README.md LICENSE "$name"
          tar czf "$name.tar.gz" "$name"
          shasum -a 256 "$name.tar.gz" > "$name.tar.gz.sha256"
          gh release upload "$TAG" "$name.tar.gz" "$name.tar.gz.sha256"
