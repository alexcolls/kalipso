<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kalipso docs</title>
<style>
  :root { --bg:#fff; --fg:#1f2328; --muted:#656d76; --line:#d0d7de; --side:#f6f8fa; --accent:#7c3aed; --code:#f3f4f6; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#0d1117; --fg:#e6edf3; --muted:#8b949e; --line:#30363d; --side:#161b22; --accent:#a78bfa; --code:#1c2128; }
  }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--fg); font:16px/1.6 system-ui,-apple-system,Segoe UI,sans-serif; display:flex; min-height:100vh; }
  nav { width:250px; flex:none; background:var(--side); border-right:1px solid var(--line); padding:20px 16px; position:sticky; top:0; height:100vh; overflow:auto; }
  nav h1 { font:700 18px monospace; margin:0 0 16px; }
  nav h1 span { color:var(--accent); }
  nav a { display:block; padding:6px 10px; border-radius:6px; color:var(--fg); text-decoration:none; font-size:14px; }
  nav a:hover { background:var(--line); }
  nav a.on { background:var(--accent); color:#fff; }
  nav .gh { margin-top:16px; color:var(--muted); }
  main { flex:1; min-width:0; max-width:860px; padding:32px 40px 80px; margin:0 auto; }
  main a { color:var(--accent); }
  h1,h2,h3 { line-height:1.25; }
  h2 { border-bottom:1px solid var(--line); padding-bottom:.3em; margin-top:2em; }
  code { background:var(--code); padding:.15em .35em; border-radius:4px; font-size:.9em; }
  pre { background:var(--code); padding:14px; border-radius:8px; overflow:auto; }
  pre code { background:none; padding:0; }
  table { border-collapse:collapse; display:block; overflow:auto; }
  th,td { border:1px solid var(--line); padding:6px 12px; text-align:left; }
  th { background:var(--side); }
  blockquote { margin:1em 0; padding:.2em 1em; border-left:4px solid var(--accent); color:var(--muted); }
  @media (max-width:760px) {
    body { flex-direction:column; }
    nav { width:100%; height:auto; position:static; border-right:0; border-bottom:1px solid var(--line); }
    main { padding:20px 16px 60px; }
  }
</style>
</head>
<body>
<nav>
  <h1><span>&gt;_</span> kalipso</h1>
  <div id="nav"></div>
  <a class="gh" href="https://github.com/alexcolls/kalipso">GitHub ↗</a>
</nav>
<main id="doc">Loading…</main>
<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.1.6/purify.min.js"></script>
<script>
// Add a page here when you add a docs/*.md file. Paths are relative to this folder.
const PAGES = [
  ['index.md', 'Overview'],
  ['installation.md', 'Installation'],
  ['desktop.md', 'Kalipso desktop'],
  ['cli.md', 'Using kalipso-cli'],
  ['agents.md', 'AI providers and agents'],
  ['language-servers.md', 'Language servers'],
  ['troubleshooting.md', 'Troubleshooting'],
  ['development.md', 'Development'],
];
const nav = document.getElementById('nav'), doc = document.getElementById('doc');
const slug = t => t.toLowerCase().replace(/[^\w\s-]/g, '').trim().replace(/\s+/g, '-');

nav.innerHTML = PAGES.map(([p, t]) => `<a href="#/${p}" data-p="${p}">${t}</a>`).join('');

async function render() {
  // route: #/page.md or #/page.md#section
  const [, page = 'index.md', anchor] = location.hash.match(/^#\/([^#]*)(?:#(.*))?$/) || [];
  const entry = PAGES.find(([p]) => p === page);
  nav.querySelectorAll('a').forEach(a => a.classList.toggle('on', a.dataset.p === page));
  if (!entry) { doc.textContent = 'Page not found.'; return; }
  document.title = entry[1] + ' · Kalipso docs';
  try {
    const res = await fetch(page);
    if (!res.ok) throw new Error(res.status);
    const html = marked.parse(await res.text());
    doc.innerHTML = DOMPurify.sanitize(html);
  } catch (e) {
    doc.textContent = 'Could not load ' + page + ' (' + e.message + '). Serve this folder over HTTP.';
    return;
  }
  doc.querySelectorAll('h1,h2,h3,h4').forEach(h => h.id = slug(h.textContent));
  // docs links: foo.md#x -> in-app route; other relative links untouched
  doc.querySelectorAll('a[href]').forEach(a => {
    const m = a.getAttribute('href').match(/^([\w-]+\.md)(#.*)?$/);
    if (m) a.setAttribute('href', '#/' + m[1] + (m[2] || ''));
  });
  const target = anchor && document.getElementById(anchor);
  (target || doc).scrollIntoView();
}
addEventListener('hashchange', render);
render();
</script>
</body>
</html>
